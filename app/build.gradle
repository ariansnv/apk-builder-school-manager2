plugins {
    id 'com.android.application'
}

def keystoreFile = System.getenv('ANDROID_KEYSTORE_FILE') ?: 'release.keystore'
def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: 'SchoolManager2026!'
def keyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: 'schoolmanager'
def keyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: keystorePassword

android {
    namespace 'com.schoolmanager.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.schoolmanager.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (file(keystoreFile).exists()) {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'kotlin/**']
        }
    }
}

dependencies {
}
