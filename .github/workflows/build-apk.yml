name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      branding_url:
        description: 'آدرس کامل API برندینگ (مثال: https://my.emamhadischool.ir/public/api/pwa/apk-branding)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Android project path
        id: android
        run: |
          if [ -f "gradlew" ] && [ -d "app" ]; then
            echo "root=." >> "$GITHUB_OUTPUT"
            echo "Found Android project at repository root."
          elif [ -f "android-app/gradlew" ] && [ -d "android-app/app" ]; then
            echo "root=android-app" >> "$GITHUB_OUTPUT"
            echo "Found Android project in android-app/."
          else
            echo "::error::Android project not found."
            ls -la
            if [ -d android-app ]; then ls -la android-app; fi
            exit 1
          fi

      - name: Validate branding URL
        run: |
          URL="${{ inputs.branding_url }}"
          if [[ ! "$URL" =~ ^https:// ]]; then
            echo "::error::branding_url must start with https://"
            exit 1
          fi
          echo "Branding URL is valid: $URL"

      - name: Fetch and validate branding API
        id: branding
        run: |
          URL="${{ inputs.branding_url }}"
          echo "Fetching branding from: $URL"
          RESPONSE=$(curl -s -f "$URL") || {
            echo "::error::Failed to fetch branding API"
            exit 1
          }
          echo "$RESPONSE" > branding.json
          cat branding.json

          if ! echo "$RESPONSE" | grep -q '"ok":\s*true'; then
            echo "::error::API did not return ok: true"
            exit 1
          fi
          if echo "$RESPONSE" | grep -q 'example.com'; then
            echo "::error::start_url still contains example.com — fix it in admin panel"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for Gradle
        working-directory: ${{ steps.android.outputs.root }}
        run: chmod +x gradlew

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow

      - name: Apply branding
        working-directory: ${{ steps.android.outputs.root }}
        run: |
          if [ -f "scripts/apply_apk_branding.py" ]; then
            echo "Running apply_apk_branding.py ..."
            python3 scripts/apply_apk_branding.py . "${{ inputs.branding_url }}"
          elif [ -f "scripts/apply-apk-branding.sh" ]; then
            bash scripts/apply-apk-branding.sh "${{ inputs.branding_url }}"
          else
            echo "::error::Branding script not found in $(pwd)"
            ls -la scripts/ || true
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ steps.android.outputs.root }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-manager-apk
          path: ${{ steps.android.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
